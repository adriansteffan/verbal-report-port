services:
  web-verbal-rike:
    init: true
    build: .
    # change if needed (adjusts the permission of the generated folder)
    user: 1000:1000
    ports:
      - "8005:8080"
    volumes:
      # sync ressources folder
      - ../ressources:/usr/src/app/ressources
      - ../logs:/usr/src/app/logs
    
    restart: always

  transcribe:
    profiles: ["transcribe"]
    build:
      context: ../transcription
      dockerfile: Dockerfile.cpu
    volumes:
      - ../ressources:/data
      - model-cache:/root/.cache/huggingface
    environment:
      - DATA_DIR=/data

  transcribe-gpu:
    profiles: ["transcribe-gpu"]
    build:
      context: ../transcription
      dockerfile: Dockerfile.gpu
    volumes:
      - ../ressources:/data
      - model-cache:/root/.cache/huggingface
    environment:
      - DATA_DIR=/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  model-cache:

